<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>小芋头</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <svg class="icon-definitions" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="icon-heart" viewBox="0 0 24 24">
      <path d="M20.8 4.9a5.4 5.4 0 0 0-7.6 0L12 6.1l-1.2-1.2a5.4 5.4 0 0 0-7.6 7.6L12 21l8.8-8.5a5.4 5.4 0 0 0 0-7.6Z"/>
    </symbol>
    <symbol id="icon-star" viewBox="0 0 24 24">
      <path d="m12 2.8 2.8 5.7 6.3.9-4.6 4.5 1.1 6.3-5.6-3-5.6 3 1.1-6.3-4.6-4.5 6.3-.9L12 2.8Z"/>
    </symbol>
    <symbol id="icon-comment" viewBox="0 0 24 24">
      <path d="M20.5 11.4a8.4 8.4 0 0 1-8.7 8.2 9.4 9.4 0 0 1-3.5-.7L4 20l1.2-3.8a8 8 0 0 1-1.9-5A8.4 8.4 0 0 1 12 3a8.4 8.4 0 0 1 8.5 8.4Z"/>
    </symbol>
  </svg>

  <main class="post">
    <section class="post-image" aria-label="帖子图片">
      <div class="brand">小芋头</div>
      <img src="images/旅游照片.jpg" alt="风景">
    </section>

    <article class="post-detail">
      <header class="author">
        <div class="author-info">
          <img class="avatar avatar-author" src="images/头像-作者.jpg" alt="">
          <span class="author-name">整体性与隐缠序</span>
        </div>
        <button class="follow-button" type="button" aria-pressed="false">关注</button>
      </header>

      <div class="detail-scroll">
        <section class="post-content">
          <h1>旅行日记 - day3</h1>
          <p>现在我正站在</p>
        </section>

        <section class="comments" aria-labelledby="comments-heading">
          <h2 id="comments-heading">共 <span id="comment-count">2</span> 条评论</h2>
          <div class="comment-list" id="comment-list">
            <article class="comment">
              <img class="avatar" src="images/头像-评论1.jpg" alt="">
              <div class="comment-body">
                <span class="comment-name">云朵慢慢走</span>
                <p>这文案，是没写完就发出来了吗？</p>
              </div>
            </article>
            <article class="comment">
              <img class="avatar" src="images/头像-评论2.jpg" alt="">
              <div class="comment-body">
                <span class="comment-name">夏日散步</span>
                <p>照片拍的不错</p>
              </div>
            </article>
          </div>
        </section>
      </div>

      <footer class="post-actions">
        <form class="comment-form" id="comment-form">
          <label class="sr-only" for="comment-input">写评论</label>
          <input id="comment-input" name="comment" type="text" placeholder="说点什么..." maxlength="200" autocomplete="off">
        </form>
        <div class="action-buttons">
          <button class="icon-button like-button" type="button" aria-label="点赞" aria-pressed="false">
            <svg class="icon"><use href="#icon-heart"></use></svg>
          </button>
          <button class="icon-button save-button" type="button" aria-label="收藏" aria-pressed="false">
            <svg class="icon"><use href="#icon-star"></use></svg>
          </button>
          <button class="icon-button comment-button" type="button" aria-label="写评论">
            <svg class="icon"><use href="#icon-comment"></use></svg>
          </button>
        </div>
      </footer>
    </article>
  </main>
</body>
</html>
